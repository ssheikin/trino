<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="description" content="Web Interface - Trino">
    <title>Confirm Authentication - Trino</title>

    <link rel="icon" href="/ui/assets/favicon.ico">

    <!-- Bootstrap core -->
    <link href="/ui/vendor/bootstrap/css/bootstrap.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="/ui/assets/trino.css" rel="stylesheet">
</head>

<body>

<div class="container">
    <h2>Confirm Authentication</h2>
    <p>A third party would like to access your Trino account in order to run queries on your behalf</p>
    <p>
        <strong>
            DO NOT click the "Continue" button unless you initiated the authentication yourself (e.g. from the Trino CLI, JDBC driver, or another client).
        </strong>
    </p>
    <form method="POST" action="">
        <input type="hidden" name="_csrf" value="<!-- CSRF_TOKEN -->"/>
        <button type="submit" class="btn btn-primary btn-lg">Continue</button>
    </form>
</div>

</body>
</html>
